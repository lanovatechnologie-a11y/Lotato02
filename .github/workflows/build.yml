name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les composants SDK nécessaires
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" --sdk_root=$ANDROID_SDK_ROOT

      - name: Créer local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle (gère le wrapper automatiquement)
        uses: gradle/actions/setup-gradle@v3

      - name: Générer le wrapper si absent
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK Release (non signé)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: lotato-pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: lotato-pro-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
