plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.lotato.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.lotato.pro"
        minSdk 21          // Android 5.0 (couvre 99%+ des POS)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ---- Impression ESC/POS générique (Bluetooth, USB, WiFi) ----
    // Compatible avec tous POS Android non-Sunmi
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.3.0'

    // ---- Sunmi SDK (fichier AAR local, voir README) ----
    // Décommentez si vous avez le SDK Sunmi :
    // implementation(name: 'SunmiPrintSDK', ext: 'aar')

    // HTML → ESC/POS conversion
    implementation 'org.jsoup:jsoup:1.17.2'
}
